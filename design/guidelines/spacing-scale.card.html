<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base. Section padding runs to 120px+." -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 22px 28px; }
  .rows { display: flex; flex-direction: column; gap: 9px; }
  .r { display: flex; align-items: center; gap: 14px; }
  .bar { height: 12px; background: var(--cream); border-radius: 1px; }
  .bar.accent { background: var(--ochre); }
  .tok { font-size: 12px; color: var(--sage); width: 78px; font-variant-numeric: tabular-nums; }
  .px { font-size: 12px; color: var(--cream); width: 46px; font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="rows">
    <div class="r"><span class="tok">--space-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
    <div class="r"><span class="tok">--space-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
    <div class="r"><span class="tok">--space-5</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
    <div class="r"><span class="tok">--space-6</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
    <div class="r"><span class="tok">--space-7</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
    <div class="r"><span class="tok">--space-8</span><span class="px">64</span><div class="bar" style="width:64px"></div></div>
    <div class="r"><span class="tok">--space-9</span><span class="px">96</span><div class="bar" style="width:96px"></div></div>
    <div class="r"><span class="tok">--space-10</span><span class="px">120</span><div class="bar accent" style="width:120px"></div></div>
  </div>
</body></html>
