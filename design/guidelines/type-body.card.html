<!-- @dsCard group="Type" viewport="700x230" name="Body & caption" subtitle="Editorial serif body, 1.8 — one sentence per line. Caption stays sans." -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 24px 28px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .meta { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); margin-bottom: 6px; }
  .body { font-family: var(--font-display); font-size: 19px; line-height: 1.85; color: var(--cream); max-width: 600px; font-weight: 400; }
  .body .ochre { color: var(--ochre); }
  .cap { font-family: var(--font-sans); font-size: 14px; line-height: 1.5; color: var(--sage); }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="meta">Body · Editorial serif · 1.8</div>
      <p class="body">할인은 손님을 부른다.<br>하지만 할인으로 온 손님은 할인이 끝나면 떠난다.<br>남는 건 <span class="ochre">관계</span>지, 가격이 아니다.</p>
    </div>
    <div>
      <div class="meta">Small / Caption · 14/13 · Sage</div>
      <p class="cap">사장 이야기 · 2026.06 · 읽는 데 4분</p>
    </div>
  </div>
</body></html>
