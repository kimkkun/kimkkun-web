<!-- @dsCard group="Type" viewport="700x190" name="Display & H1" subtitle="Playfair Display + Noto Serif KR — headlines run big" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 24px 28px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .spec { display: flex; flex-direction: column; gap: 4px; }
  .meta { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); }
  .d { font-family: var(--font-display); font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 800; color: var(--cream); }
  .h1 { font-family: var(--font-display); font-size: 40px; line-height: 1.15; letter-spacing: -0.015em; font-weight: 700; color: var(--cream); }
</style></head>
<body>
  <div class="stack">
    <div class="spec"><span class="meta">Display · 72/40 · Serif ExtraBold · -0.02em</span><span class="d">할 말만 한다.</span></div>
    <div class="spec"><span class="meta">H1 · 48/32 · Serif Bold</span><span class="h1">손님은 많은데, 단골이 없다.</span></div>
  </div>
</body></html>
