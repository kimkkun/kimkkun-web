<!-- @dsCard group="Type" viewport="700x180" name="Headings H2 / H3" subtitle="Serif H2 → sans H3. Mid-sizes used sparingly." -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 24px 28px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .spec { display: flex; flex-direction: column; gap: 4px; }
  .meta { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); }
  .h2 { font-family: var(--font-display); font-size: 32px; line-height: 1.25; letter-spacing: -0.01em; font-weight: 700; color: var(--cream); }
  .h3 { font-size: 24px; line-height: 1.35; font-weight: 700; color: var(--cream); }
</style></head>
<body>
  <div class="stack">
    <div class="spec"><span class="meta">H2 · 32/24 · Serif Bold</span><span class="h2">할인은 전략이 아니다. 변명이다.</span></div>
    <div class="spec"><span class="meta">H3 · 24/20 · Sans Bold</span><span class="h3">단골은 만드는 게 아니라, 남는 것이다.</span></div>
  </div>
</body></html>
