<!-- @dsCard group="Website" viewport="1280x800" name="kimkkun.com" subtitle="Hero → Problem → View → Work → Proof → CTA → Footer, click-through" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김꾼 — 단골은 운이 아니다. 설계다.</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; }

  .kk-container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-pad-x); }

  /* ── Reveal: fade/slide only ── */
  [data-reveal] { opacity: 0; transform: translateY(14px);
    transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); }
  [data-reveal].is-in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { [data-reveal] { opacity: 1; transform: none; } }

  /* ── Nav ── */
  .kk-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    border-bottom: 1px solid transparent;
    transition: background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); }
  .kk-nav.is-scrolled { background: var(--forest); border-bottom-color: var(--sage-line); }
  .kk-nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 32px; height: 68px; }
  .kk-nav-mark { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; }
  .kk-nav-word { font-family: var(--font-display); font-size: 23px; font-weight: 800; color: var(--cream); letter-spacing: -0.02em; }
  .kk-nav-tick { width: 14px; height: 2px; background: var(--ochre); align-self: center; }
  .kk-nav-links { display: flex; gap: 28px; }
  .kk-nav-link { font-size: 14px; font-weight: 500; color: var(--cream-dim); text-decoration: none;
    transition: color var(--dur-fast) var(--ease-out); }
  .kk-nav-link:hover { color: var(--cream); }

  /* ── Sections ── */
  .kk-section { padding: var(--section-pad-y) 0; background: var(--bg); color: var(--text); }
  .kk-section.light { background: var(--cream-surface); color: var(--ink); }
  .kk-section.deep { background: var(--forest-deep); }
  .kk-sec-head { display: flex; flex-direction: column; gap: 20px; margin-bottom: 72px; }
  .kk-sec-title { font-family: var(--font-display); font-size: clamp(32px, 4vw, 48px); line-height: 1.2;
    letter-spacing: -0.015em; font-weight: 700; margin: 0; text-wrap: balance; }
  .kk-section.light .kk-sec-title { color: var(--ink); }

  /* ── Hero ── */
  .kk-hero { min-height: 88vh; display: flex; align-items: center; background: var(--bg);
    padding: 160px 0 var(--section-pad-y); }
  .kk-hero-title { font-family: var(--font-display); font-size: clamp(44px, 6.5vw, 76px); line-height: 1.16;
    letter-spacing: -0.02em; font-weight: 800; color: var(--cream); margin: 28px 0 0; }
  .kk-hero-lead { font-family: var(--font-display); font-size: 19px; line-height: 1.85; color: var(--cream-dim);
    max-width: 560px; margin: 32px 0 0; text-wrap: pretty; }
  .kk-hero-actions { display: flex; gap: 14px; margin-top: 44px; }
  .kk-hero-meta { display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 96px; padding-top: 26px;
    border-top: 1px solid var(--sage-line); }
  .kk-hero-meta span { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: var(--sage); }

  /* ── Problem ── */
  .kk-problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .kk-problem-item { border-top: 1px solid var(--sage-line-ink); padding-top: 24px;
    display: flex; flex-direction: column; gap: 12px; }
  .kk-problem-num { font-size: 13px; font-weight: 700; color: var(--ochre); font-variant-numeric: tabular-nums; }
  .kk-problem-title { font-family: var(--font-display); font-size: 23px; line-height: 1.4; font-weight: 700;
    color: var(--ink); margin: 0; }
  .kk-problem-body { font-size: 16px; line-height: 1.7; color: var(--ink-dim); margin: 0; text-wrap: pretty; }

  /* ── Belief ── */
  .kk-belief-list { display: flex; flex-direction: column; }
  .kk-belief-line { font-family: var(--font-display); font-size: clamp(26px, 3.2vw, 38px); line-height: 1.4;
    font-weight: 600; color: var(--cream); margin: 0; padding: 34px 0;
    border-top: 1px solid var(--sage-line); }
  .kk-belief-line:last-child { border-bottom: 1px solid var(--sage-line); }

  /* ── Categories ── */
  .kk-cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .kk-cat-grid > div { display: grid; }

  /* ── Results ── */
  .kk-proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .kk-proof-item { border-top: 1px solid var(--sage-line); padding-top: 26px;
    display: flex; flex-direction: column; gap: 14px; }
  .kk-proof-num { font-family: var(--font-display); font-size: clamp(34px, 3.6vw, 46px); font-weight: 700;
    color: var(--cream); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .kk-proof-body { font-size: 16px; line-height: 1.6; color: var(--cream-dim); margin: 0; }

  /* ── CTA ── */
  .kk-cta-wrap .kk-sec-head { margin-bottom: 40px; }
  .kk-cta-lead { font-family: var(--font-display); font-size: 19px; line-height: 1.8; color: var(--cream-dim);
    margin: 8px 0 0; }
  .kk-cta-actions { display: flex; gap: 14px; align-items: center; min-height: 54px; }
  .kk-cta-done { font-family: var(--font-display); font-size: 21px; color: var(--cream); margin: 0; }

  /* ── Footer ── */
  .kk-footer { background: var(--forest-deep); border-top: 1px solid var(--sage-line); padding: 72px 0 40px; }
  .kk-footer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px;
    padding-bottom: 48px; }
  .kk-footer-mark { display: flex; flex-direction: column; gap: 8px; }
  .kk-footer-word { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: var(--cream);
    letter-spacing: -0.02em; }
  .kk-footer-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.28em;
    color: var(--sage); font-weight: 500; }
  .kk-footer-bar { width: 22px; height: 2px; background: var(--ochre); }
  .kk-footer-links { display: flex; flex-wrap: wrap; gap: 14px 26px; }
  .kk-footer-link { font-size: 14px; color: var(--cream-dim); text-decoration: none;
    transition: color var(--dur-fast) var(--ease-out); }
  .kk-footer-link:hover { color: var(--cream); }
  .kk-footer-bottom { display: flex; justify-content: space-between; gap: 20px;
    border-top: 1px solid var(--sage-line); padding-top: 24px; font-size: 13px; color: var(--sage); }

  @media (max-width: 860px) {
    .kk-problem-grid, .kk-cat-grid, .kk-proof-grid { grid-template-columns: 1fr; }
    .kk-nav-links { display: none; }
    .kk-hero { padding-top: 120px; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Problem.jsx"></script>
  <script type="text/babel" src="Belief.jsx"></script>
  <script type="text/babel" src="Categories.jsx"></script>
  <script type="text/babel" src="Results.jsx"></script>
  <script type="text/babel" src="CTA.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
